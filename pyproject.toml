[project]
name = "m365graph"
version = "0.1.0"
description = "A small Microsoft Graph client: app-only sign-in, retries and throttling, paging and delta queries, and SharePoint libraries as stores of folders and files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "msal>=1.23",
    "requests>=2.31",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "python-dotenv>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
